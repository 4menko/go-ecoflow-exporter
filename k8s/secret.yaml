# IMPORTANT: Replace placeholder values before applying.
# Never commit real credentials to git — use kubectl apply directly or a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: ecoflow-credentials
  namespace: ecoflow
type: Opaque
stringData:
  email: "your-ecoflow-email@example.com"   # replace with your EcoFlow account email
  password: "your-ecoflow-password"          # replace with your EcoFlow account password
